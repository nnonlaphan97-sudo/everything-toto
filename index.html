
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Phone Peeking</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #111;
  color: white;
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  cursor: pointer;
}

.phone {
  position: relative;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: linear-gradient(160deg, #8ba4bd, #d2b9bb 55%, #e4d6c8);
}

/* STATUS BAR */
.status {
  position: absolute;
  top: 14px;
  left: 24px;
  right: 24px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 30;
  color: white;
  font-size: 14px;
  font-weight: 600;
  pointer-events: none;
}

.status-icons {
  display: inline-flex !important;
  flex-direction: row !important;
  flex-wrap: nowrap !important;
  align-items: center !important;
  justify-content: flex-end;
  gap: 5px;
  width: auto;
  height: 16px;
  white-space: nowrap;
  flex-shrink: 0;
}

.signal-icon {
  display: block;
  width: 18px;
  height: 14px;
  flex: 0 0 18px;
}

.network {
  display: inline-block !important;
  flex: 0 0 auto;
  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: 700;
  line-height: 14px;
  letter-spacing: -0.3px;
  color: white;
  white-space: nowrap;
}

.battery-icon {
  display: block;
  width: 29px;
  height: 14px;
  flex: 0 0 29px;
}

/* LOCK SCREEN */
.screen {
  position: absolute;
  inset: 0;
  display: none;
  overflow: hidden;
}

.screen.active {
  display: block;
}
#lockScreen {
  background-image: url("https://i.ibb.co/H8XC2by/r07qxo-R-Download.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  touch-action: pan-y;
}


.lock-content {
  position: absolute;
  top: 15%;
  left: 0;
  right: 0;
  text-align: center;
  padding: 0 20px;
}

.lock-date {
  font-size: 17px;
  font-weight: 500;
  margin-bottom: 5px;
}

.lock-time {
  font-size: clamp(76px, 23vw, 112px);
  line-height: 1;
  font-weight: 300;
  letter-spacing: -5px;
}

.lock-message {
  margin-top: 22px;
  font-size: 14px;
  opacity: 0.9;
}

.swipe-hint {
  position: absolute;
  bottom: 72px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 13px;
  opacity: 0.85;
}

.bottom-indicators {
  position: absolute;
  bottom: 28px;
  left: 28px;
  right: 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.round-button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.25);
  font-size: 19px;
}

/* PASSCODE SCREEN */

/* PASSCODE SCREEN */
#passcodeScreen {
  background-image: url("https://i.ibb.co/H8XC2by/r07qxo-R-Download.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  text-align: center;
  isolation: isolate;
}

#passcodeScreen::before {
  content: "";
  position: absolute;
  inset: -20px;
  background-image: url("https://i.ibb.co/H8XC2by/r07qxo-R-Download.jpg");
  background-size: cover;
  background-position: center;
  filter: blur(18px) brightness(0.65);
  z-index: -1;
  pointer-events: none;
}

.passcode-content {
  position: absolute;
  top: 15%;
  left: 0;
  right: 0;
  padding: 0 25px;
}

.passcode-title {
  font-size: 23px;
  font-weight: 600;
  margin-bottom: 8px;
}

.passcode-subtitle {
  font-size: 14px;
  opacity: 0.85;
}

.dots {
  display: flex;
  justify-content: center;
  gap: 17px;
  margin: 30px 0 12px;
}

.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1px solid white;
  background: transparent;
}

.dot.filled {
  background: white;
}

.pin-error {
  min-height: 20px;
  font-size: 13px;
  color: #fff;
}

.keypad {
  position: absolute;
  top: 40%;
  bottom: 75px;
  left: 50%;
  transform: translateX(-50%);
  width: min(280px, 82vw);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 10px;
}

.key {
  justify-self: center;
  align-self: center;
  width: 66px;
  height: 66px;
  max-width: 19vw;
  max-height: 19vw;
  border-radius: 50%;
  background: rgba(255,255,255,0.19);
  border: 1px solid rgba(255,255,255,0.2);
  font-size: 28px;
  font-weight: 400;
}

.key:active {
  background: rgba(255,255,255,0.4);
}

.key small {
  display: block;
  font-size: 9px;
  letter-spacing: 1px;
}

.key.empty {
  visibility: hidden;
}

.cancel-pin {
  position: absolute;
  bottom: 28px;
  left: 28px;
  background: transparent;
  font-size: 14px;
}

.delete-pin {
  position: absolute;
  bottom: 28px;
  right: 28px;
  background: transparent;
  font-size: 14px;
}

/* HOME SCREEN */
#homeScreen {
  background: linear-gradient(160deg, #879bb6, #c5acbc 55%, #ead8c9);
}

.home-welcome {
  position: absolute;
  top: 12%;
  left: 24px;
  right: 24px;
}

.home-date {
  font-size: 14px;
  opacity: 0.9;
}

.home-title {
  margin-top: 5px;
  font-size: 32px;
  font-weight: 700;
}

.home-subtitle {
  margin-top: 5px;
  font-size: 14px;
  opacity: 0.9;
}

.app-grid {
  position: absolute;
  top: 29%;
  left: 24px;
  right: 24px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px 12px;
}

.app {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  background: transparent;
}

.app-icon {
  width: min(58px, 15vw);
  height: min(58px, 15vw);
  border-radius: 15px;
  display: grid;
  place-items: center;
  font-size: 27px;
  background: rgba(255,255,255,0.88);
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.app-label {
  font-size: 11px;
  color: white;
  text-shadow: 0 1px 4px rgba(0,0,0,0.25);
}

.dock {
  position: absolute;
  bottom: 48px;
  left: 20px;
  right: 20px;
  height: 85px;
  border-radius: 26px;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  justify-content: space-evenly;
}

.dock .app-icon {
  width: 52px;
  height: 52px;
  font-size: 25px;
}

.home-indicator {
  position: absolute;
  z-index: 40;
  bottom: 9px;
  left: 50%;
  transform: translateX(-50%);
  width: 135px;
  height: 5px;
  border-radius: 10px;
  background: white;
  cursor: pointer;
}

/* APP WINDOW */
#appWindow {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: none;
  background: #f7f7f7;
  color: #222;
}

#appWindow.open {
  display: block;
}

.app-header {
  height: 60px;
  padding: 20px 18px 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  border-bottom: 1px solid #e6e6e6;
}

.back-button {
  color: #3478f6;
  background: transparent;
  font-size: 16px;
}

.app-body {
  padding: 20px;
  color: #333;
  font-size: 15px;
}

.app-card {
  background: white;
  padding: 15px;
  border-radius: 14px;
  margin-bottom: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}

@media (max-height: 680px) {
  .lock-content { top: 12%; }
  .passcode-content { top: 11%; }
  .keypad { top: 36%; bottom: 55px; gap: 4px; }
  .key { width: 55px; height: 55px; }
  .app-grid { top: 26%; gap: 16px 10px; }
  .dock { bottom: 35px; }
}
</style>
</head>

<body>
<div class="phone">

  <!-- STATUS BAR: สัญญาณ | 5G | แบตเตอรี่ -->
  <div class="status">
    <span id="statusTime">09:41</span>

    <div class="status-icons">
      <svg class="signal-icon" viewBox="0 0 20 15" aria-label="สัญญาณมือถือ">
        <rect x="0" y="10" width="3.5" height="4" rx=".6" fill="white"/>
        <rect x="5" y="7" width="3.5" height="7" rx=".6" fill="white"/>
        <rect x="10" y="4" width="3.5" height="10" rx=".6" fill="white"/>
        <rect x="15" y="1" width="3.5" height="13" rx=".6" fill="white"/>
      </svg>

      <span class="network">5G</span>

      <svg class="battery-icon" viewBox="0 0 32 15" aria-label="แบตเตอรี่">
        <rect x=".6" y="1" width="27" height="13" rx="3"
          fill="none" stroke="white" stroke-width="1.2"/>
        <rect x="2.2" y="2.6" width="17.5" height="9.8" rx="1.5"
          fill="#34C759"/>
        <rect x="28.5" y="4.5" width="2.5" height="6" rx=".8"
          fill="white"/>
      </svg>
    </div>
  </div>

  <!-- LOCK SCREEN -->
  <section id="lockScreen" class="screen active">
    <div class="lock-content">
      <div class="lock-date" id="lockDate">วันอังคารที่ 27 ตุลาคม</div>
      <div class="lock-time" id="lockTime">09:41</div>
      <div class="lock-message">ยินดีต้อนรับกลับมา ♡</div>
    </div>

    <div class="swipe-hint">ปัดขึ้นเพื่อปลดล็อก</div>

    <div class="bottom-indicators">
      <button class="round-button" aria-label="ไฟฉาย">☼</button>
      <button class="round-button" aria-label="กล้อง">◎</button>
    </div>
  </section>

  <!-- PASSCODE SCREEN -->
  <section id="passcodeScreen" class="screen">
    <div class="passcode-content">
      <div class="passcode-title">ป้อนรหัสผ่าน</div>
      <div class="passcode-subtitle">กรอกรหัส 6 หลักเพื่อปลดล็อก</div>

      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <div class="pin-error" id="pinError"></div>
    </div>

    <div class="keypad">
      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2<small>ABC</small></button>
      <button class="key" data-digit="3">3<small>DEF</small></button>
      <button class="key" data-digit="4">4<small>GHI</small></button>
      <button class="key" data-digit="5">5<small>JKL</small></button>
      <button class="key" data-digit="6">6<small>MNO</small></button>
      <button class="key" data-digit="7">7<small>PQRS</small></button>
      <button class="key" data-digit="8">8<small>TUV</small></button>
      <button class="key" data-digit="9">9<small>WXYZ</small></button>
      <button class="key empty"></button>
      <button class="key" data-digit="0">0</button>
      <button class="key empty"></button>
    </div>

    <button class="cancel-pin" id="cancelPin">ยกเลิก</button>
    <button class="delete-pin" id="deletePin">ลบ</button>
  </section>

  <!-- HOME SCREEN -->
  <section id="homeScreen" class="screen">
    <div class="home-welcome">
      <div class="home-date" id="homeDate">วันอังคารที่ 27 ตุลาคม</div>
      <div class="home-title">Hello ♡</div>
      <div class="home-subtitle">ยินดีต้อนรับสู่โทรศัพท์ของคุณ</div>
    </div>

    <div class="app-grid">
      <button class="app" data-app="Messages">
        <span class="app-icon">💬</span>
        <span class="app-label">Messages</span>
      </button>
      <button class="app" data-app="Contacts">
        <span class="app-icon">👤</span>
        <span class="app-label">Contacts</span>
      </button>
      <button class="app" data-app="Photos">
        <span class="app-icon">🌈</span>
        <span class="app-label">Photos</span>
      </button>
      <button class="app" data-app="Notes">
        <span class="app-icon">📝</span>
        <span class="app-label">Notes</span>
      </button>
      <button class="app" data-app="Social">
        <span class="app-icon">🩷</span>
        <span class="app-label">Social</span>
      </button>
      <button class="app" data-app="Calls">
        <span class="app-icon">📞</span>
        <span class="app-label">Calls</span>
      </button>
      <button class="app" data-app="Calendar">
        <span class="app-icon">📅</span>
        <span class="app-label">Calendar</span>
      </button>
      <button class="app" data-app="Music">
        <span class="app-icon">🎵</span>
        <span class="app-label">Music</span>
      </button>
      <button class="app" data-app="Settings">
        <span class="app-icon">⚙️</span>
        <span class="app-label">Settings</span>
      </button>
    </div>

    <div class="dock">
      <button class="app" data-app="Calls">
        <span class="app-icon">📞</span>
      </button>
      <button class="app" data-app="Messages">
        <span class="app-icon">💬</span>
      </button>
      <button class="app" data-app="Photos">
        <span class="app-icon">🌈</span>
      </button>
      <button class="app" data-app="Music">
        <span class="app-icon">🎵</span>
      </button>
    </div>
  </section>

  <!-- APP WINDOW -->
  <div id="appWindow">
    <div class="app-header">
      <button class="back-button" id="backHome">‹ กลับ</button>
      <span id="appTitle">App</span>
    </div>
    <div class="app-body" id="appBody"></div>
  </div>

  <!-- HOME INDICATOR -->
  <button class="home-indicator" id="homeIndicator" aria-label="ล็อกหน้าจอ"></button>

</div>

<script>
const PIN = "121269";

const lockScreen = document.getElementById("lockScreen");
const passcodeScreen = document.getElementById("passcodeScreen");
const homeScreen = document.getElementById("homeScreen");
const appWindow = document.getElementById("appWindow");
const pinError = document.getElementById("pinError");
const dots = [...document.querySelectorAll(".dot")];

let enteredPin = "";
let touchStartY = 0;

function showScreen(screen) {
  [lockScreen, passcodeScreen, homeScreen].forEach(item => {
    item.classList.remove("active");
  });
  screen.classList.add("active");
  appWindow.classList.remove("open");
}

function updatePinDots() {
  dots.forEach((dot, index) => {
    dot.classList.toggle("filled", index < enteredPin.length);
  });
}

function clearPin() {
  enteredPin = "";
  updatePinDots();
}

function enterDigit(digit) {
  if (enteredPin.length >= 4) return;

  enteredPin += digit;
  updatePinDots();

  if (enteredPin.length === 4) {
    if (enteredPin === PIN) {
      pinError.textContent = "";
      setTimeout(() => {
        clearPin();
        showScreen(homeScreen);
      }, 150);
    } else {
      pinError.textContent = "รหัสไม่ถูกต้อง ลองอีกครั้ง";
      setTimeout(() => {
        clearPin();
        pinError.textContent = "";
      }, 900);
    }
  }
}

document.querySelectorAll("[data-digit]").forEach(button => {
  button.addEventListener("click", () => {
    enterDigit(button.dataset.digit);
  });
});

document.getElementById("deletePin").addEventListener("click", () => {
  enteredPin = enteredPin.slice(0, -1);
  pinError.textContent = "";
  updatePinDots();
});

document.getElementById("cancelPin").addEventListener("click", () => {
  clearPin();
  pinError.textContent = "";
  showScreen(lockScreen);
});

function unlockPrompt() {
  clearPin();
  pinError.textContent = "";
  showScreen(passcodeScreen);
}

lockScreen.addEventListener("touchstart", event => {
  touchStartY = event.touches[0].clientY;
}, {passive: true});

lockScreen.addEventListener("touchend", event => {
  const endY = event.changedTouches[0].clientY;
  if (touchStartY - endY > 35) unlockPrompt();
}, {passive: true});

lockScreen.addEventListener("click", event => {
  if (event.target.closest("button")) return;
  unlockPrompt();
});

let startY = 0;
homeScreen.addEventListener("touchstart", event => {
  startY = event.touches[0].clientY;
}, {passive: true});

homeScreen.addEventListener("touchend", event => {
  const endY = event.changedTouches[0].clientY;
  if (endY - startY > 100 && startY < 100) {
    showScreen(lockScreen);
  }
}, {passive: true});

/* Simple demo content for each app */
const appContent = {
  Messages: `
    <div class="app-card">💬 Messages</div>
    <div class="app-card">ยังไม่มีข้อความใหม่</div>
  `,
  Contacts: `
    <div class="app-card">👤 Contacts</div>
    <div class="app-card">รายชื่อผู้ติดต่อ</div>
  `,
  Photos: `
    <div class="app-card">🌈 Photos</div>
    <div class="app-card">รูปภาพของคุณจะแสดงที่นี่</div>
  `,
  Notes: `
    <div class="app-card">📝 Notes</div>
    <div class="app-card" contenteditable="true">แตะตรงนี้เพื่อเขียนโน้ต...</div>
  `,
  Social: `
    <div class="app-card">🩷 Social</div>
    <div class="app-card">พื้นที่โซเชียลของคุณ</div>
  `,
  Calls: `
    <div class="app-card">📞 Calls</div>
    <div class="app-card">ยังไม่มีประวัติการโทร</div>
  `,
  Calendar: `
    <div class="app-card">📅 Calendar</div>
    <div class="app-card">ไม่มีนัดหมายในวันนี้</div>
  `,
  Music: `
    <div class="app-card">🎵 Music</div>
    <div class="app-card">♪ เพลงโปรดของคุณ ♪</div>
  `,
  Settings: `
    <div class="app-card">⚙️ Settings</div>
    <div class="app-card">การตั้งค่าโทรศัพท์</div>
    <div class="app-card">หน้าจอและความสว่าง</div>
    <div class="app-card">เสียงและการสั่น</div>
  `
};

document.querySelectorAll("[data-app]").forEach(button => {
  button.addEventListener("click", () => {
    const name = button.dataset.app;
    document.getElementById("appTitle").textContent = name;
    document.getElementById("appBody").innerHTML =
      appContent[name] || `<div class="app-card">${name}</div>`;
    appWindow.classList.add("open");
  });
});

document.getElementById("backHome").addEventListener("click", () => {
  appWindow.classList.remove("open");
});

document.getElementById("homeIndicator").addEventListener("click", () => {
  if (appWindow.classList.contains("open")) {
    appWindow.classList.remove("open");
    return;
  }

  if (homeScreen.classList.contains("active")) {
    showScreen(lockScreen);
  } else if (passcodeScreen.classList.contains("active")) {
    showScreen(lockScreen);
    clearPin();
  }
});

/* Clock and date */
function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString("th-TH", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });

  const date = now.toLocaleDateString("th-TH", {
    weekday: "long",
    day: "numeric",
    month: "long"
  });

  document.getElementById("statusTime").textContent = time;
  document.getElementById("lockTime").textContent = time;
  document.getElementById("lockDate").textContent = date;
  document.getElementById("homeDate").textContent = date;
}

updateClock();
setInterval(updateClock, 30000);
</script>
</body>
</html>
