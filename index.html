
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111116">
<title>Phone Peeking — Galaxy Z Fold8</title>

<style>
:root {
  --white: #fff;
  --muted: rgba(255,255,255,.66);
  --glass: rgba(28,27,36,.64);
  --accent: #d9c7ff;
  --pink: #e84aff;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Noto Sans Thai", sans-serif;
  color: var(--white);
  background: #101015;
}

button { font: inherit; color: inherit; }

button:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  padding: 10px;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 15% 15%, #39304d, transparent 42%),
    radial-gradient(ellipse at 85% 85%, #39263f, transparent 42%),
    #101015;
}

.phone {
  position: relative;
  isolation: isolate;
  width: min(100%, 390px);
  height: min(calc(100dvh - 20px), 850px);
  min-height: 440px;
  overflow: hidden;
  border: 3px solid #34343b;
  border-radius: 40px;
  background: #17171d;
  box-shadow: 0 24px 70px #000a, inset 0 0 0 1px #ffffff12;
  touch-action: pan-y;
}

.wallpaper {
  position: absolute;
  inset: 0;
  z-index: -2;
  background:
    linear-gradient(180deg, #10101a18 0%, #17142116 40%, #10101570 100%),
    url("https://i.ibb.co/H8XC2by/r07qxo-R-Download.jpg") center / cover no-repeat,
    linear-gradient(145deg, #696080, #25243b 55%, #a17a9b);
  transform: scale(1.02);
}

.wallpaper::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, #00000012, transparent 40%, #00000028);
  pointer-events: none;
}

.status-bar {
  position: absolute;
  z-index: 50;
  top: 0;
  left: 0;
  right: 0;
  height: 37px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 21px;
  font-size: 12px;
  font-weight: 650;
  pointer-events: none;
  text-shadow: 0 1px 5px #0008;
}

.status-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

.signal {
  display: flex;
  align-items: end;
  gap: 2px;
  height: 12px;
}

.signal i {
  width: 3px;
  border-radius: 2px;
  background: white;
}
.signal i:nth-child(1) { height: 4px; }
.signal i:nth-child(2) { height: 6px; }
.signal i:nth-child(3) { height: 9px; }
.signal i:nth-child(4) { height: 11px; }

.wifi {
  font-size: 14px;
  line-height: 1;
}

.battery {
  position: relative;
  width: 23px;
  height: 12px;
  border: 1px solid white;
  border-radius: 4px;
  padding: 2px;
  margin-left: 2px;
}

.battery::before {
  content: "";
  display: block;
  height: 100%;
  width: 78%;
  border-radius: 1px;
  background: white;
}

.battery::after {
  content: "";
  position: absolute;
  right: -3px;
  top: 3px;
  width: 2px;
  height: 4px;
  border-radius: 0 2px 2px 0;
  background: white;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  overflow: hidden;
}

.screen.active { display: block; }

#lockScreen {
  padding: 51px 20px 35px;
  display: none;
  flex-direction: column;
  align-items: stretch;
}

#lockScreen.active { display: flex; }

.lock-date {
  margin-top: 12px;
  text-align: center;
  font-size: 14px;
  font-weight: 550;
  color: #fffffff0;
  text-shadow: 0 2px 12px #0005;
}

.lock-clock {
  margin: 7px 0 0;
  text-align: center;
  font-size: clamp(67px, 19vw, 84px);
  font-weight: 300;
  letter-spacing: -5px;
  line-height: 1.06;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 3px 18px #0003;
}

/* แคปซูลเพลงบนหน้าจอล็อก */
.mini-player {
  position: absolute;
  left: 50%;
  bottom: 88px;
  transform: translateX(-50%);
  width: min(260px, calc(100% - 48px));
  min-height: 58px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  border: 1px solid #ffffff18;
  border-radius: 32px;
  background: rgba(28, 25, 38, .78);
  box-shadow: 0 8px 28px #0003;
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
}

.mini-open {
  min-width: 0;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0;
  text-align: left;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.mini-art {
  width: 36px;
  height: 36px;
  flex: 0 0 36px;
  border-radius: 50%;
  object-fit: cover;
  background: linear-gradient(135deg, #9d77ad, #272333);
}

.mini-info { min-width: 0; }

.mini-title {
  font-size: 11px;
  font-weight: 750;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mini-artist {
  margin-top: 3px;
  font-size: 9px;
  color: #ffffffa8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mini-controls {
  display: flex;
  align-items: center;
  gap: 7px;
}

.mini-controls button {
  width: 27px;
  height: 36px;
  padding: 0;
  border: 0;
  background: transparent;
  display: grid;
  place-items: center;
  font-size: 16px;
  cursor: pointer;
}

.mini-controls .mini-play {
  font-size: 19px;
}

.lock-shortcuts {
  position: absolute;
  left: 28px;
  right: 28px;
  bottom: 31px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.shortcut {
  width: 45px;
  height: 45px;
  display: grid;
  place-items: center;
  border: 1px solid #ffffff2a;
  border-radius: 50%;
  background: #16151e66;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  font-size: 20px;
  cursor: pointer;
}

.unlock-hint {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 13px;
  text-align: center;
  font-size: 10px;
  color: #ffffffb8;
  pointer-events: none;
}

/* หน้าเล่นเพลงเต็มจอ */
#playerScreen {
  padding: 48px 23px 35px;
  background: linear-gradient(180deg, #37303f, #17161e 65%, #111116);
}

.player-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 32px;
  margin-bottom: 18px;
}

.round-button {
  width: 35px;
  height: 35px;
  border: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #ffffff12;
  font-size: 21px;
  cursor: pointer;
}

.player-label {
  text-align: center;
  font-size: 10px;
  letter-spacing: 1.2px;
  font-weight: 700;
  color: #ffffffa8;
}

.player-album {
  display: block;
  width: min(100%, 310px);
  aspect-ratio: 1;
  margin: 8px auto 23px;
  object-fit: cover;
  border-radius: 23px;
  background: linear-gradient(135deg, #8a7099, #292436);
  box-shadow: 0 18px 45px #0005;
}

.player-track-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 21px;
}

.player-track-info { min-width: 0; flex: 1; }

.player-track-title {
  font-size: 21px;
  font-weight: 750;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.player-track-artist {
  margin-top: 5px;
  font-size: 13px;
  color: #ffffffa5;
}

.player-favorite {
  border: 0;
  background: transparent;
  font-size: 25px;
  cursor: pointer;
}

.player-status {
  margin: -11px 0 13px;
  font-size: 10px;
  color: #ffffff82;
}

.progress-slider {
  width: 100%;
  height: 4px;
  margin: 0;
  border-radius: 10px;
  appearance: none;
  -webkit-appearance: none;
  background: #ffffff42;
  outline: none;
  cursor: pointer;
}

.progress-slider::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 0 3px #ffffff1a;
}

.progress-slider::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border: 0;
  border-radius: 50%;
  background: white;
}

.player-times {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 10px;
  color: #ffffffa1;
  font-variant-numeric: tabular-nums;
}

.player-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 17px;
}

.player-controls button {
  width: 43px;
  height: 43px;
  border: 0;
  background: transparent;
  display: grid;
  place-items: center;
  font-size: 21px;
  cursor: pointer;
}

.player-controls .main-play {
  width: 59px;
  height: 59px;
  border-radius: 50%;
  background: white;
  color: #22212a;
  font-size: 24px;
}

.player-bottom-note {
  margin-top: 20px;
  text-align: center;
  font-size: 10px;
  color: #ffffff6e;
}

/* PIN */
#pinScreen {
  padding: 74px 25px 35px;
  text-align: center;
  background: #17151dd9;
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
}

.pin-lock-icon {
  font-size: 30px;
  margin: 6px 0 17px;
}

.pin-heading {
  font-size: 23px;
  font-weight: 650;
}

.pin-subtitle {
  margin-top: 8px;
  font-size: 12px;
  color: var(--muted);
}

.pin-dots {
  display: flex;
  justify-content: center;
  gap: 17px;
  margin: 30px 0 18px;
}

.pin-dot {
  width: 10px;
  height: 10px;
  border: 1px solid #ffffffc9;
  border-radius: 50%;
}

.pin-dot.filled { background: white; }

.pin-error {
  min-height: 19px;
  font-size: 11px;
  color: #ffb9c5;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px 20px;
  width: min(100%, 270px);
  margin: 10px auto 0;
}

.key {
  width: 100%;
  height: 53px;
  border: 1px solid #ffffff20;
  border-radius: 50%;
  background: #ffffff13;
  font-size: 23px;
  cursor: pointer;
}

.key:active { background: #ffffff35; }

.key .letters {
  display: block;
  margin-top: 0;
  font-size: 7px;
  letter-spacing: 1px;
  opacity: .7;
}

.key.action {
  font-size: 11px;
  border-color: transparent;
  background: transparent;
}

#homeScreen {
  padding: 55px 19px 30px;
  overflow-y: auto;
  scrollbar-width: none;
}
#homeScreen::-webkit-scrollbar { display: none; }

.home-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 4px 3px 22px;
}

.home-date {
  font-size: 12px;
  text-shadow: 0 1px 5px #0005;
}

.home-weather {
  font-size: 13px;
  text-shadow: 0 1px 5px #0005;
}

.home-clock {
  font-size: 53px;
  font-weight: 350;
  letter-spacing: -2px;
  line-height: 1;
  margin: 0 0 24px 2px;
  font-variant-numeric: tabular-nums;
}

.home-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 20px 8px;
  padding: 8px 0 18px;
}

.app-icon {
  min-width: 0;
  border: 0;
  background: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  cursor: pointer;
}

.app-art {
  width: 49px;
  height: 49px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  overflow: hidden;
  box-shadow: 0 4px 12px #0003;
  background: #f3f3f5;
  color: #292832;
  font-size: 23px;
}

.app-label {
  font-size: 10px;
  line-height: 1.2;
  color: white;
  text-align: center;
  max-width: 72px;
  overflow-wrap: anywhere;
  text-shadow: 0 1px 5px #000a;
}

.dock {
  position: sticky;
  bottom: 4px;
  margin: 8px -5px 0;
  padding: 9px 8px;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 7px;
  border-radius: 23px;
  border: 1px solid #ffffff24;
  background: #25232f88;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}

.dock .app-label { display: none; }
.dock .app-art { width: 46px; height: 46px; }

.app-window {
  position: absolute;
  z-index: 35;
  inset: 39px 9px 13px;
  display: none;
  flex-direction: column;
  border-radius: 27px;
  overflow: hidden;
  border: 1px solid #ffffff26;
  background: #191820f5;
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
}

.app-window.open { display: flex; }

.app-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 17px;
  border-bottom: 1px solid #ffffff15;
}

.back-button {
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 50%;
  background: #ffffff15;
  font-size: 22px;
  cursor: pointer;
}

.app-header h2 {
  font-size: 16px;
  margin: 0;
  font-weight: 650;
}

.app-content {
  padding: 17px;
  overflow: auto;
  font-size: 13px;
  line-height: 1.6;
  color: #ffffffeb;
}

.app-card {
  padding: 14px;
  margin-bottom: 12px;
  border-radius: 17px;
  background: #ffffff0d;
  border: 1px solid #ffffff0c;
}

.app-card strong {
  display: block;
  margin-bottom: 5px;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid #ffffff17;
}

.toggle {
  width: 42px;
  height: 24px;
  border: 0;
  border-radius: 20px;
  background: #777;
  padding: 3px;
  cursor: pointer;
}

.toggle::after {
  content: "";
  display: block;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: white;
  transition: transform .2s;
}

.toggle.on { background: #9c83ee; }
.toggle.on::after { transform: translateX(18px); }

.toast {
  position: absolute;
  z-index: 70;
  bottom: 48px;
  left: 50%;
  transform: translate(-50%, 10px);
  opacity: 0;
  pointer-events: none;
  padding: 9px 14px;
  border-radius: 20px;
  background: #19181feF;
  font-size: 11px;
  white-space: nowrap;
  transition: .2s;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.gesture-bar {
  position: absolute;
  z-index: 65;
  bottom: 7px;
  left: 50%;
  transform: translateX(-50%);
  width: 104px;
  height: 4px;
  border-radius: 10px;
  background: white;
  box-shadow: 0 1px 5px #0005;
  cursor: pointer;
}

@media (max-height: 690px) {
  .phone { min-height: 0; }
  #lockScreen { padding-top: 43px; }
  .lock-date { margin-top: 7px; }
  .lock-clock { font-size: 62px; }
  .mini-player { bottom: 77px; }
  .lock-shortcuts { bottom: 24px; }
  .shortcut { width: 39px; height: 39px; }
  #playerScreen { padding-top: 42px; }
  .player-top { margin-bottom: 7px; }
  .player-album {
    width: min(65%, 250px);
    margin: 3px auto 13px;
  }
  .player-track-row { margin-bottom: 14px; }
  .player-controls { margin-top: 10px; }
  .player-controls .main-play { width: 51px; height: 51px; }
  .player-bottom-note { margin-top: 10px; }
  #pinScreen { padding-top: 55px; }
  .pin-dots { margin: 20px 0 12px; }
  .keypad { gap: 5px 20px; margin-top: 5px; }
  .key { height: 47px; }
  .home-grid { gap: 13px 7px; }
}

@media (max-height: 570px) {
  .player-album { width: min(53%, 195px); }
  .player-track-title { font-size: 18px; }
  .player-controls button { height: 37px; }
  .player-controls .main-play { width: 44px; height: 44px; }
  .pin-lock-icon { display: none; }
  .pin-heading { margin-top: 4px; }
  .pin-subtitle { margin-top: 4px; }
  .pin-dots { margin: 14px 0 8px; }
  .key { height: 41px; }
}
</style>
</head>

<body>
<main class="phone" id="phone">
  <div class="wallpaper"></div>

  <div class="status-bar">
    <span id="statusTime">09:41</span>
    <div class="status-right">
      <span class="signal"><i></i><i></i><i></i><i></i></span>
      <span class="wifi">⌁</span>
      <span class="battery"></span>
    </div>
  </div>

  <!-- LOCK SCREEN -->
  <section class="screen active" id="lockScreen">
    <div class="lock-date" id="lockDate">วันอังคารที่ 27 ตุลาคม</div>
    <div class="lock-clock" id="lockClock">09:41</div>

    <!-- แตะปกเพลงหรือรายละเอียดเพื่อเปิดหน้าเล่นเพลง -->
    <div class="mini-player">
      <button class="mini-open" id="openPlayer" aria-label="เปิดหน้าเล่นเพลง">
        <img
          class="mini-art"
          src="https://img.youtube.com/vi/HKBifVrELZI/hqdefault.jpg"
          alt="ปกเพลง"
          onerror="this.style.background='linear-gradient(135deg,#8a6a91,#282333)'"
        >
        <span class="mini-info">
          <span class="mini-title" id="miniTitle">ไม่คิดนอกใจ</span>
          <span class="mini-artist" id="miniArtist">LOSO</span>
        </span>
      </button>

      <div class="mini-controls">
        <button id="miniPrevious" aria-label="เพลงก่อนหน้า">|◀</button>
        <button class="mini-play" id="miniToggle" aria-label="เล่นหรือหยุด">▶</button>
        <button id="miniNext" aria-label="เพลงถัดไป">▶|</button>
      </div>
    </div>

    <div class="lock-shortcuts">
      <button class="shortcut" id="lockPhone" aria-label="โทรศัพท์">☎</button>
      <button class="shortcut" id="lockCamera" aria-label="กล้อง">▣</button>
    </div>

    <div class="unlock-hint">ปัดขึ้นเพื่อปลดล็อก</div>
  </section>

  <!-- FULL MUSIC PLAYER -->
  <section class="screen" id="playerScreen">
    <div class="player-top">
      <button class="round-button" id="playerBack" aria-label="กลับหน้าล็อก">⌄</button>
      <div class="player-label">กำลังเล่น</div>
      <button class="round-button" id="playerMore" aria-label="ตัวเลือก">⋮</button>
    </div>

    <img
      class="player-album"
      id="playerAlbum"
      src="https://img.youtube.com/vi/HKBifVrELZI/hqdefault.jpg"
      alt="ปกอัลบั้ม"
      onerror="this.style.background='linear-gradient(135deg,#8a6a91,#282333)'"
    >

    <div class="player-track-row">
      <div class="player-track-info">
        <div class="player-track-title" id="playerTitle">ไม่คิดนอกใจ</div>
        <div class="player-track-artist" id="playerArtist">LOSO</div>
      </div>
      <button class="player-favorite" id="favoriteButton" aria-label="ถูกใจ">♡</button>
    </div>

    <div class="player-status" id="playerStatus">หยุดเล่นอยู่ · โหมดจำลอง</div>

    <input
      class="progress-slider"
      id="progressSlider"
      type="range"
      min="0"
      max="228"
      value="84"
      aria-label="ตำแหน่งเพลง"
    >

    <div class="player-times">
      <span id="currentTime">1:24</span>
      <span id="durationTime">3:48</span>
    </div>

    <div class="player-controls">
      <button id="shuffleButton" aria-label="สุ่มเพลง">⤨</button>
      <button id="playerPrevious" aria-label="เพลงก่อนหน้า">|◀</button>
      <button class="main-play" id="playerToggle" aria-label="เล่นหรือหยุด">▶</button>
      <button id="playerNext" aria-label="เพลงถัดไป">▶|</button>
      <button id="repeatButton" aria-label="เล่นซ้ำ">↻</button>
    </div>

    <div class="player-bottom-note">Music Player · โหมดจำลอง ไม่มีเสียงจริง</div>
  </section>

  <!-- PIN SCREEN -->
  <section class="screen" id="pinScreen">
    <div class="pin-lock-icon">♙</div>
    <div class="pin-heading">ใส่ PIN</div>
    <div class="pin-subtitle">ป้อน PIN เพื่อปลดล็อกโทรศัพท์</div>

    <div class="pin-dots" id="pinDots">
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
    </div>

    <div class="pin-error" id="pinError"></div>

    <div class="keypad">
      <button class="key" data-pin="1">1</button>
      <button class="key" data-pin="2">2<span class="letters">ABC</span></button>
      <button class="key" data-pin="3">3<span class="letters">DEF</span></button>
      <button class="key" data-pin="4">4<span class="letters">GHI</span></button>
      <button class="key" data-pin="5">5<span class="letters">JKL</span></button>
      <button class="key" data-pin="6">6<span class="letters">MNO</span></button>
      <button class="key" data-pin="7">7<span class="letters">PQRS</span></button>
      <button class="key" data-pin="8">8<span class="letters">TUV</span></button>
      <button class="key" data-pin="9">9<span class="letters">WXYZ</span></button>
      <button class="key action" id="pinCancel">ยกเลิก</button>
      <button class="key" data-pin="0">0</button>
      <button class="key action" id="pinDelete">ลบ</button>
    </div>
  </section>

  <!-- HOME SCREEN -->
  <section class="screen" id="homeScreen">
    <div class="home-top">
      <div class="home-date" id="homeDate">วันอังคาร 27 ต.ค.</div>
      <div class="home-weather">☀ 29°</div>
    </div>

    <div class="home-clock" id="homeClock">09:41</div>

    <div class="home-grid">
      <button class="app-icon" data-app="LINE">
        <span class="app-art" style="background:#06c755;color:white">●</span>
        <span class="app-label">LINE</span>
      </button>

      <button class="app-icon" data-app="รูปภาพ">
        <span class="app-art" style="background:#fff0d9">🌈</span>
        <span class="app-label">รูปภาพ</span>
      </button>

      <button class="app-icon" data-app="YouTube">
        <span class="app-art" style="background:#ff0033;color:white">▶</span>
        <span class="app-label">YouTube</span>
      </button>

      <button class="app-icon" data-app="Instagram">
        <span class="app-art" style="background:linear-gradient(135deg,#7645d8,#ed2b77,#ffb64c);color:white">◎</span>
        <span class="app-label">Instagram</span>
      </button>

      <button class="app-icon" data-app="Facebook">
        <span class="app-art" style="background:#1877f2;color:white;font-weight:bold">f</span>
        <span class="app-label">Facebook</span>
      </button>

      <button class="app-icon" data-app="TikTok">
        <span class="app-art" style="background:#101015;color:white">♫</span>
        <span class="app-label">TikTok</span>
      </button>

      <button class="app-icon" data-app="ปฏิทิน">
        <span class="app-art" style="color:#e34d59">27</span>
        <span class="app-label">ปฏิทิน</span>
      </button>

      <button class="app-icon" data-app="โน้ต">
        <span class="app-art" style="background:#ffe36b">📝</span>
        <span class="app-label">โน้ต</span>
      </button>

      <button class="app-icon" data-app="แผนที่">
        <span class="app-art" style="background:#d8f0df">📍</span>
        <span class="app-label">แผนที่</span>
      </button>

      <button class="app-icon" data-app="นาฬิกา">
        <span class="app-art" style="background:#ececf2">◷</span>
        <span class="app-label">นาฬิกา</span>
      </button>

      <button class="app-icon" data-app="การตั้งค่า">
        <span class="app-art" style="background:#b9bdc8">⚙</span>
        <span class="app-label">การตั้งค่า</span>
      </button>

      <button class="app-icon" data-app="เพลง">
        <span class="app-art" style="background:linear-gradient(135deg,#d6c4f4,#7960a9);color:white">♫</span>
        <span class="app-label">เพลง</span>
      </button>
    </div>

    <div class="dock">
      <button class="app-icon" data-app="โทรศัพท์">
        <span class="app-art" style="background:#35c96c;color:white">☎</span>
        <span class="app-label">โทรศัพท์</span>
      </button>
      <button class="app-icon" data-app="ข้อความ">
        <span class="app-art" style="background:#55b9fa;color:white">▰</span>
        <span class="app-label">ข้อความ</span>
      </button>
      <button class="app-icon" data-app="LINE">
        <span class="app-art" style="background:#06c755;color:white">●</span>
        <span class="app-label">LINE</span>
      </button>
      <button class="app-icon" data-app="กล้อง">
        <span class="app-art" style="background:#d9dce5">▣</span>
        <span class="app-label">กล้อง</span>
      </button>
    </div>
  </section>

  <!-- APP WINDOW -->
  <section class="app-window" id="appWindow">
    <header class="app-header">
      <button class="back-button" id="closeApp" aria-label="ย้อนกลับ">‹</button>
      <h2 id="appTitle">แอป</h2>
    </header>
    <div class="app-content" id="appContent"></div>
  </section>

  <div class="toast" id="toast"></div>
  <div class="gesture-bar" id="gestureBar" aria-label="กลับหรือปัดขึ้น"></div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const CORRECT_PIN = "121269";
  const screens = ["lockScreen", "playerScreen", "pinScreen", "homeScreen"];

  let currentScreen = "lockScreen";
  let enteredPin = "";
  let isMusicOn = false;
  let isFavorite = false;
  let isShuffle = false;
  let isRepeat = false;
  let toastTimer;
  let touchStartY = 0;
  let touchStartX = 0;

  const tracks = [
    {
      title: "ไม่คิดนอกใจ",
      artist: "LOSO",
      image: "https://img.youtube.com/vi/HKBifVrELZI/hqdefault.jpg",
      duration: 228,
      position: 84
    },
    {
      title: "Like A G6",
      artist: "Far East Movement",
      image: "https://img.youtube.com/vi/w4s6H4ku6ZY/hqdefault.jpg",
      duration: 217,
      position: 151
    }
  ];

  let trackIndex = 0;

  function toast(message) {
    $("toast").textContent = message;
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      $("toast").classList.remove("show");
    }, 1700);
  }

  function showScreen(id) {
    screens.forEach(screenId => $(screenId).classList.remove("active"));
    $(id).classList.add("active");
    currentScreen = id;
    $("appWindow").classList.remove("open");
  }

  function openPin() {
    enteredPin = "";
    updatePinDots();
    $("pinError").textContent = "";
    showScreen("pinScreen");
  }

  function updatePinDots() {
    document.querySelectorAll(".pin-dot").forEach((dot, index) => {
      dot.classList.toggle("filled", index < enteredPin.length);
    });
  }

  function addPin(number) {
    if (enteredPin.length >= 6) return;

    enteredPin += number;
    updatePinDots();
    $("pinError").textContent = "";

    if (enteredPin.length !== 6) return;

    if (enteredPin === CORRECT_PIN) {
      showScreen("homeScreen");
      toast("ปลดล็อกแล้ว");
    } else {
      $("pinError").textContent = "PIN ไม่ถูกต้อง ลองอีกครั้ง";
      document.querySelectorAll("[data-pin]").forEach(button => {
        button.disabled = true;
      });

      setTimeout(() => {
        enteredPin = "";
        updatePinDots();
        document.querySelectorAll("[data-pin]").forEach(button => {
          button.disabled = false;
        });
        $("pinError").textContent = "";
      }, 650);
    }
  }

  function formatTime(seconds) {
    const s = Math.max(0, Math.floor(Number(seconds) || 0));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function currentTrack() {
    return tracks[trackIndex];
  }

  function updateTrackUI() {
    const track = currentTrack();

    $("miniTitle").textContent = track.title;
    $("miniArtist").textContent = track.artist;
    $("playerTitle").textContent = track.title;
    $("playerArtist").textContent = track.artist;

    $("playerAlbum").src = track.image;
    document.querySelector(".mini-art").src = track.image;

    $("progressSlider").max = track.duration;
    $("progressSlider").value = track.position;

    $("currentTime").textContent = formatTime(track.position);
    $("durationTime").textContent = formatTime(track.duration);

    updateMusicState();
  }

  function updateMusicState() {
    const icon = isMusicOn ? "Ⅱ" : "▶";

    $("miniToggle").textContent = icon;
    $("playerToggle").textContent = icon;

    $("playerStatus").textContent = isMusicOn
      ? "กำลังเล่นอยู่ · โหมดจำลอง"
      : "หยุดเล่นอยู่ · โหมดจำลอง";

    $("miniToggle").setAttribute(
      "aria-label",
      isMusicOn ? "หยุดเพลง" : "เล่นเพลง"
    );

    $("playerToggle").setAttribute(
      "aria-label",
      isMusicOn ? "หยุดเพลง" : "เล่นเพลง"
    );
  }

  function toggleMusic() {
    // เปลี่ยนเฉพาะสถานะ ไม่มีการเล่นเสียงจริง
    isMusicOn = !isMusicOn;
    updateMusicState();
  }

  function changeTrack(direction) {
    trackIndex = (trackIndex + direction + tracks.length) % tracks.length;
    updateTrackUI();
    toast("เปลี่ยนเพลงแล้ว");
  }

  function updateClock() {
    const now = new Date();

    const time = new Intl.DateTimeFormat("th-TH", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }).format(now);

    const dateLong = new Intl.DateTimeFormat("th-TH", {
      weekday: "long",
      day: "numeric",
      month: "long"
    }).format(now);

    const dateShort = new Intl.DateTimeFormat("th-TH", {
      weekday: "short",
      day: "numeric",
      month: "short"
    }).format(now);

    $("statusTime").textContent = time;
    $("lockClock").textContent = time;
    $("homeClock").textContent = time;
    $("lockDate").textContent = dateLong;
    $("homeDate").textContent = dateShort;
  }

  const appContent = {
    "LINE": `
      <div class="app-card"><strong>LINE</strong>หน้าจอจำลอง</div>
      <div class="app-card">💬 แชต</div>
      <div class="app-card">👥 รายชื่อเพื่อน</div>
      <p>ไม่ได้เชื่อมต่อบัญชี LINE จริง</p>`,

    "รูปภาพ": `
      <div class="app-card"><strong>รูปภาพ</strong>คลังรูปภาพจำลอง</div>
      <p>หน้าจอแกลเลอรีจำลอง</p>`,

    "YouTube": `
      <div class="app-card"><strong>▶ YouTube</strong>วิดีโอและเพลง</div>
      <p>หน้าจอจำลอง ไม่มีการเล่นวิดีโอจริง</p>`,

    "Instagram": `
      <div class="app-card"><strong>Instagram</strong>แชร์ช่วงเวลาของคุณ</div>
      <p>หน้าจอจำลอง</p>`,

    "Facebook": `
      <div class="app-card"><strong>Facebook</strong>ติดตามเรื่องราวและเพื่อน ๆ</div>
      <p>หน้าจอจำลอง</p>`,

    "TikTok": `
      <div class="app-card"><strong>TikTok</strong>วิดีโอสั้น</div>
      <p>หน้าจอจำลอง</p>`,

    "ปฏิทิน": `
      <div class="app-card">
        <strong>ปฏิทินของฉัน</strong>
        <span id="calendarToday"></span>
      </div>
      <div class="app-card">📌 วางแผนวันสำคัญ</div>`,

    "โน้ต": `
      <div class="app-card">
        <strong>โน้ตใหม่</strong>
        <textarea id="noteText" placeholder="พิมพ์โน้ตของคุณ..."
          style="width:100%;min-height:130px;border:0;border-radius:12px;padding:12px;background:#ffffff12;color:white;font:inherit;resize:vertical"></textarea>
        <button id="saveNote"
          style="margin-top:10px;border:0;border-radius:18px;padding:9px 16px;background:#d9c7ff;color:#272131">
          บันทึกโน้ต
        </button>
      </div>`,

    "แผนที่": `
      <div class="app-card"><strong>📍 แผนที่</strong>ตำแหน่งจำลอง</div>
      <p>ยังไม่ได้เชื่อมต่อแผนที่จริง</p>`,

    "นาฬิกา": `
      <div class="app-card">
        <strong>เวลาปัจจุบัน</strong>
        <div id="appClock" style="font-size:36px"></div>
      </div>
      <div class="app-card">⏱ นาฬิกาจับเวลา</div>
      <div class="app-card">⏰ ตั้งปลุก</div>`,

    "การตั้งค่า": `
      <div class="app-card"><strong>การตั้งค่า</strong>Galaxy Z Fold — หน้าจอจำลอง</div>
      <div class="setting-row">
        <span>โหมดมืด</span>
        <button class="toggle on" id="darkToggle" aria-label="สลับโหมดมืด"></button>
      </div>
      <div class="setting-row">
        <span>สถานะเพลง</span>
        <button class="toggle" id="settingMusicToggle" aria-label="สลับสถานะเพลง"></button>
      </div>
      <div class="setting-row"><span>PIN หน้าจอ</span><span>••••••</span></div>
      <p style="margin-top:14px;font-size:12px;opacity:.7">PIN สำหรับปลดล็อก: 121269</p>`,

    "เพลง": `
      <div class="app-card" style="text-align:center">
        <img id="appAlbum" src="" alt="ปกเพลง"
          style="width:100%;max-width:220px;border-radius:18px">
        <strong id="appTrackTitle" style="margin-top:12px"></strong>
        <div id="appTrackArtist"></div>
        <p id="appMusicStatus" style="margin-top:12px"></p>
        <button id="appMusicToggle"
          style="border:0;border-radius:50%;width:54px;height:54px;background:#fff;color:#222;font-size:20px">▶</button>
      </div>
      <p style="font-size:12px;opacity:.7">เปลี่ยนสถานะจำลองเท่านั้น ไม่มีเสียงจริง</p>`,

    "โทรศัพท์": `
      <div class="app-card"><strong>☎ โทรศัพท์</strong>แป้นกดหมายเลขจำลอง</div>
      <div style="font-size:25px;text-align:center;padding:20px;line-height:2">
        1　2　3<br>4　5　6<br>7　8　9<br>＊　0　#
      </div>`,

    "ข้อความ": `
      <div class="app-card"><strong>ข้อความ</strong>ยังไม่มีข้อความใหม่</div>
      <p>หน้าจอข้อความจำลอง</p>`,

    "กล้อง": `
      <div class="app-card" style="text-align:center;padding:30px 12px">
        <div style="font-size:65px">▣</div>
        <strong>กล้อง</strong>
        <p>ตัวอย่างหน้าจอกล้อง</p>
        <button id="fakeShutter"
          style="border:4px solid white;background:#ddd;width:60px;height:60px;border-radius:50%">
        </button>
      </div>`
  };

  function openApp(name) {
    $("appTitle").textContent = name;
    $("appContent").innerHTML =
      appContent[name] || `<div class="app-card">${name}</div>`;

    $("appWindow").classList.add("open");

    if (name === "นาฬิกา") {
      updateAppClock();
    }

    if (name === "ปฏิทิน") {
      $("calendarToday").textContent = new Intl.DateTimeFormat("th-TH", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }).format(new Date());
    }

    if (name === "การตั้งค่า") {
      $("settingMusicToggle").classList.toggle("on", isMusicOn);

      $("settingMusicToggle").addEventListener("click", () => {
        toggleMusic();
        $("settingMusicToggle").classList.toggle("on", isMusicOn);
      });

      $("darkToggle").addEventListener("click", event => {
        event.currentTarget.classList.toggle("on");
        toast("ปรับการแสดงผลแล้ว");
      });
    }

    if (name === "เพลง") {
      $("appAlbum").src = currentTrack().image;
      $("appTrackTitle").textContent = currentTrack().title;
      $("appTrackArtist").textContent = currentTrack().artist;

      const updateAppMusic = () => {
        $("appMusicStatus").textContent = isMusicOn
          ? "กำลังเล่นอยู่ · โหมดจำลอง"
          : "หยุดเล่นอยู่";

        $("appMusicToggle").textContent = isMusicOn ? "Ⅱ" : "▶";
      };

      updateAppMusic();

      $("appMusicToggle").addEventListener("click", () => {
        toggleMusic();
        updateAppMusic();
      });
    }

    if (name === "โน้ต") {
      $("saveNote").addEventListener("click", () => {
        toast("บันทึกในหน้าจอนี้แล้ว");
      });
    }

    if (name === "กล้อง") {
      $("fakeShutter").addEventListener("click", () => {
        toast("โหมดกล้องจำลอง");
      });
    }
  }

  function updateAppClock() {
    const el = $("appClock");
    if (el) el.textContent = $("statusTime").textContent;
  }

  // ปุ่มตัวเลข PIN
  document.querySelectorAll("[data-pin]").forEach(button => {
    button.addEventListener("click", () => addPin(button.dataset.pin));
  });

  $("pinDelete").addEventListener("click", () => {
    enteredPin = enteredPin.slice(0, -1);
    updatePinDots();
    $("pinError").textContent = "";
  });

  $("pinCancel").addEventListener("click", () => {
    showScreen("lockScreen");
  });

  // แตะหน้าจอล็อกเพื่อกรอก PIN ยกเว้นปุ่มและตัวเล่นเพลง
  $("lockScreen").addEventListener("click", event => {
    if (event.target.closest("button")) return;
    openPin();
  });

  // เปิดหน้าเล่นเพลง
  $("openPlayer").addEventListener("click", () => {
    updateTrackUI();
    showScreen("playerScreen");
  });

  $("miniToggle").addEventListener("click", toggleMusic);
  $("playerToggle").addEventListener("click", toggleMusic);

  $("miniPrevious").addEventListener("click", () => changeTrack(-1));
  $("miniNext").addEventListener("click", () => changeTrack(1));
  $("playerPrevious").addEventListener("click", () => changeTrack(-1));
  $("playerNext").addEventListener("click", () => changeTrack(1));

  $("playerBack").addEventListener("click", () => showScreen("lockScreen"));

  $("playerMore").addEventListener("click", () => {
    toast("Music Player · โหมดจำลอง");
  });

  $("favoriteButton").addEventListener("click", () => {
    isFavorite = !isFavorite;
    $("favoriteButton").textContent = isFavorite ? "♥" : "♡";
    toast(isFavorite ? "เพิ่มในรายการโปรดแล้ว" : "นำออกจากรายการโปรดแล้ว");
  });

  $("shuffleButton").addEventListener("click", () => {
    isShuffle = !isShuffle;
    $("shuffleButton").style.color = isShuffle ? "#e5b4ff" : "white";
    toast(isShuffle ? "เปิดสุ่มเพลง" : "ปิดสุ่มเพลง");
  });

  $("repeatButton").addEventListener("click", () => {
    isRepeat = !isRepeat;
    $("repeatButton").style.color = isRepeat ? "#e5b4ff" : "white";
    toast(isRepeat ? "เปิดเล่นซ้ำ" : "ปิดเล่นซ้ำ");
  });

  $("progressSlider").addEventListener("input", event => {
    currentTrack().position = Number(event.target.value);
    $("currentTime").textContent = formatTime(currentTrack().position);
  });

  $("lockPhone").addEventListener("click", () => {
    openPin();
  });

  $("lockCamera").addEventListener("click", () => {
    openPin();
  });

  // ปัดขึ้นจากหน้าล็อกเพื่อเปิด PIN
  $("phone").addEventListener("touchstart", event => {
    touchStartY = event.changedTouches[0].clientY;
    touchStartX = event.changedTouches[0].clientX;
  }, { passive: true });

  $("phone").addEventListener("touchend", event => {
    const endY = event.changedTouches[0].clientY;
    const endX = event.changedTouches[0].clientX;
    const deltaY = touchStartY - endY;
    const deltaX = Math.abs(touchStartX - endX);

    if (deltaY > 45 && deltaY > deltaX) {
      if (currentScreen === "lockScreen") {
        openPin();
      } else if (currentScreen === "playerScreen") {
        showScreen("lockScreen");
      } else if (currentScreen === "homeScreen" &&
                 !$("appWindow").classList.contains("open")) {
        toast("หน้าจอหลัก");
      }
    }

    if (endY - touchStartY > 65 &&
        currentScreen === "playerScreen") {
      showScreen("lockScreen");
    }
  }, { passive: true });

  // Gesture bar
  $("gestureBar").addEventListener("click", () => {
    if (currentScreen === "lockScreen") {
      openPin();
    } else if (currentScreen === "playerScreen") {
      showScreen("lockScreen");
    } else if (currentScreen === "pinScreen") {
      showScreen("lockScreen");
    } else if ($("appWindow").classList.contains("open")) {
      $("appWindow").classList.remove("open");
    } else {
      toast("หน้าจอหลัก");
    }
  });

  document.querySelectorAll("[data-app]").forEach(button => {
    button.addEventListener("click", () => openApp(button.dataset.app));
  });

  $("closeApp").addEventListener("click", () => {
    $("appWindow").classList.remove("open");
  });

  updateClock();
  updateTrackUI();
  setInterval(updateClock, 1000);

})();
</script>
</body>
</html>
