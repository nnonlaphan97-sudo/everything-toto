
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#17172a">
<title>Phone Peeking · Galaxy Z Fold8</title>

<style>
:root {
  --glass: rgba(30, 29, 43, .62);
  --border: rgba(255,255,255,.18);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; width: 100%; height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #11111a; color: #fff;
}
button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
.stage {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  padding: 8px; background: radial-gradient(ellipse at center, #373247, #101017 75%);
}
.phone {
  position: relative; isolation: isolate; width: min(calc(100vw - 16px), 430px);
  height: min(calc(100dvh - 16px), 930px); aspect-ratio: 9 / 19.5;
  border: 4px solid #37363e; border-radius: 15px; overflow: hidden;
  background: #24243b; box-shadow: 0 22px 65px #0009, inset 0 0 0 1px #ffffff12;
}
.wallpaper {
  position: absolute; inset: 0; z-index: -2; background-color: #252b49;
  background-image: linear-gradient(180deg, rgba(12,12,25,.10), rgba(12,12,25,.18)), url("https://i.ibb.co/H8XC2by/r07qxo-R-Download.jpg");
  background-position: center; background-size: cover; background-repeat: no-repeat;
}
.screen { position: absolute; inset: 0; overflow: hidden; }
.hidden { display: none !important; }

/* STATUS BAR */
.status-bar {
  position: absolute; z-index: 20; top: 0; left: 0; right: 0; height: 38px;
  padding: 12px 17px 0; display: flex; justify-content: space-between; align-items: flex-start;
  font-size: 12px; font-weight: 700; pointer-events: none;
}
.status-right { display: flex; align-items: center; gap: 5px; }
.fiveg { font-size: 11px; font-weight: 800; letter-spacing: -.3px; }
.signal { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
.signal i { display: block; width: 3px; border-radius: 2px; background: #fff; }
.signal i:nth-child(1) { height: 4px; }
.signal i:nth-child(2) { height: 6px; }
.signal i:nth-child(3) { height: 9px; }
.signal i:nth-child(4) { height: 12px; }
.battery {
  position: relative; width: 22px; height: 11px; border: 1.3px solid #fff; border-radius: 3px;
  padding: 1.5px; margin-left: 2px; display: block;
}
.battery::after {
  content: ""; position: absolute; right: -4px; top: 2.5px; width: 2px; height: 4px;
  border-radius: 0 2px 2px 0; background: #fff;
}
.battery-level { display: block; height: 100%; width: 82%; border-radius: 1px; background: #fff; }

/* LOCK SCREEN */
#lockScreen { display: flex; flex-direction: column; padding: 57px 15px 20px; }
.lock-heading {
  text-align: center; flex-shrink: 0; text-shadow: 0 2px 14px #0002; transform: translateY(40px);
}
.lock-date { font-size: 18px; font-weight: 600; }

.lock-clock {
  margin-top: 3px;
  font-size: clamp(90px, 27vw, 145px);
  line-height: 1;
  font-weight: 600;
  letter-spacing: -6px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.lock-spacer { flex: 1; min-height: 20px; }

/* LOCK SCREEN BOTTOM ROW */
.lock-bottom-row {
  position: absolute; left: 15px; right: 15px; bottom: 57px; width: auto;
  display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px;
  align-items: center; column-gap: 8px; flex-shrink: 0; z-index: 25;
}
.round-shortcut {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 0;
}
.round-shortcut svg {
  width: 22px; height: 22px; fill: none; stroke: white; stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round;
}
.round-shortcut:active, .widget-play:active, .album-hit:active { transform: scale(.94); }

/* OVAL MUSIC WIDGET */
.music-widget {
  width: 100%; min-width: 0; height: 68px; padding: 7px 9px;
  border: 1px solid var(--border); border-radius: 999px; background: rgba(28,27,42,.69);
  backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  display: flex; align-items: center; gap: 8px; overflow: hidden; box-shadow: 0 5px 20px #0002;
}
.album-hit {
  width: 48px; height: 48px; flex: 0 0 48px; padding: 0; border-radius: 50%;
  overflow: hidden; background: #353344;
}
.album-hit img { width: 100%; height: 100%; display: block; object-fit: cover; }
.music-info {
  min-width: 0; flex: 1; cursor: pointer; overflow: hidden; text-align: center; padding: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
}
.song-title { width: 100%; text-align: center; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music-controls { width: 100%; display: flex; justify-content: space-around; align-items: center; gap: 0; font-size: 13px; line-height: 1; }
.inline-play { cursor: pointer; padding: 0; background: transparent; color: inherit; font: inherit; line-height: 1; }
.widget-play {
  flex: 0 0 27px; width: 27px; height: 27px; border-radius: 50%; display: grid; place-items: center;
  background: #ffffff1b; font-size: 12px; padding: 0;
}
.unlock-area {
  flex-shrink: 0; height: 25px; margin-top: 12px; display: flex;
  justify-content: center; align-items: flex-end; cursor: pointer;
}
.gesture-bar { width: 108px; height: 4px; border-radius: 99px; background: white; }

/* PIN SCREEN */
#pinScreen {
  padding: 57px 24px 20px; display: flex; flex-direction: column; align-items: center;
  background: #17162635; backdrop-filter: blur(5px);
}
.pin-back { position: absolute; top: 45px; left: 20px; width: 36px; height: 36px; border-radius: 50%; background: #ffffff1c; font-size: 25px; }
.pin-title { margin-top: 18px; font-size: 23px; font-weight: 650; }
.pin-subtitle { margin-top: 8px; font-size: 13px; color: #ffffffbf; }
.pin-dots { margin-top: 27px; display: flex; justify-content: center; gap: 17px; }
.pin-dot { width: 10px; height: 10px; border: 1px solid white; border-radius: 50%; }
.pin-dot.filled { background: white; }
.pin-error { height: 25px; margin-top: 8px; color: #ffd1d8; font-size: 12px; }
.keypad {
  width: min(100%, 282px); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  justify-items: center; align-items: center; gap: 10px 9px;
}
.key {
  width: min(100%, 64px); aspect-ratio: 1 / 1; height: auto; padding: 0; border-radius: 50%;
  border: 1px solid #ffffff20; background: #ffffff20; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.key:active { background: #ffffff45; }
.key-number { font-size: 24px; line-height: 1; }
.key-letters { margin-top: 4px; font-size: 8px; letter-spacing: 1.5px; opacity: .8; }
.key.action { border: none; background: transparent; font-size: 12px; }
.pin-bottom { margin-top: auto; height: 25px; display: flex; align-items: flex-end; }

/* HOME SCREEN */
#homeScreen { padding: 55px 20px 24px; }
.home-date { font-size: 14px; text-shadow: 0 2px 8px #0003; }
.home-clock { margin-top: 3px; font-size: 42px; font-weight: 300; }
.weather-card { margin-top: 17px; padding: 14px 16px; border: 1px solid #ffffff22; border-radius: 20px; background: #26243852; backdrop-filter: blur(15px); }
.weather-top { display: flex; align-items: center; justify-content: space-between; }
.weather-temp { font-size: 30px; font-weight: 300; }
.weather-desc { font-size: 12px; color: #ffffffb8; }
.app-grid { margin-top: 25px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 21px 8px; }
.app-button { min-width: 0; padding: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.app-icon { width: 47px; height: 47px; border-radius: 15px; display: grid; place-items: center; font-size: 23px; border: 1px solid #ffffff1a; box-shadow: 0 4px 12px #0002; }
.app-label { font-size: 10px; text-shadow: 0 1px 5px #0008; white-space: nowrap; }
.dock { position: absolute; bottom: 32px; left: 15px; right: 15px; padding: 11px 8px; border: 1px solid #ffffff1c; border-radius: 25px; background: #25243775; backdrop-filter: blur(20px); display: flex; justify-content: space-around; }
.dock .app-icon { width: 44px; height: 44px; }
.home-gesture, .app-home-gesture { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 108px; height: 4px; border-radius: 10px; background: white; }

/* FULL-SIZE MUSIC PLAYER */
#playerScreen { padding: 55px 24px 22px; display: flex; flex-direction: column; align-items: center; background: linear-gradient(180deg, #272238f2, #151522f5); backdrop-filter: blur(25px); }
.player-back { position: absolute; top: 44px; left: 18px; width: 38px; height: 38px; border-radius: 50%; background: #ffffff1c; font-size: 25px; }
.player-label { margin-top: 4px; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #ffffffb3; }
.player-cover { width: min(72%, 275px); aspect-ratio: 1; margin-top: auto; margin-bottom: 27px; overflow: hidden; border-radius: 23px; box-shadow: 0 18px 48px #0005; }
.player-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.player-details { width: 100%; flex-shrink: 0; }
.player-title { font-size: 23px; font-weight: 750; }
.player-artist { margin-top: 6px; font-size: 14px; color: #ffffffb3; }
.player-progress { margin-top: 25px; }
.progress-track { height: 4px; border-radius: 10px; overflow: hidden; background: #ffffff30; }
.progress-fill { width: 35%; height: 100%; background: white; }
.progress-times { display: flex; justify-content: space-between; margin-top: 8px; font-size: 10px; color: #ffffffa6; }
.player-controls { display: flex; align-items: center; justify-content: center; gap: 32px; margin-top: 23px; }
.player-control { width: 42px; height: 42px; border-radius: 50%; background: transparent; display: grid; place-items: center; font-size: 20px; }
.player-control.main { width: 61px; height: 61px; background: white; color: #252333; font-size: 24px; }
.player-note { margin-top: 17px; margin-bottom: auto; font-size: 10px; color: #ffffff8c; }
.player-gesture { width: 108px; height: 4px; background: white; border-radius: 10px; flex-shrink: 0; }

/* MOCK APPS */
#appScreen { padding: 54px 18px 25px; background: #f4f1f8; color: #24222c; }
.app-window-header { display: flex; align-items: center; gap: 12px; padding-bottom: 17px; border-bottom: 1px solid #00000015; }
.app-back { width: 36px; height: 36px; border-radius: 50%; background: #e7e2ef; color: #24222c; font-size: 24px; }
.app-window-title { font-size: 19px; font-weight: 750; }
.app-content { padding-top: 20px; font-size: 14px; line-height: 1.7; }
.mock-card { margin-top: 13px; padding: 16px; border-radius: 17px; background: white; box-shadow: 0 4px 15px #2416320a; }
.mock-primary { margin-top: 12px; width: 100%; padding: 12px; border-radius: 13px; background: #6654a3; color: white; font-weight: 650; }
#appScreen .app-home-gesture { background: #33313a; }
.toast {
  position: absolute; z-index: 100; bottom: 70px; left: 50%; transform: translate(-50%, 10px);
  padding: 10px 15px; border-radius: 22px; background: #181722ed; border: 1px solid #ffffff1c;
  font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: .2s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* RESPONSIVE */
@media (max-height: 740px) {
  #lockScreen { padding-top: 49px; padding-bottom: 15px; }
.lock-clock {
  font-size: clamp(90px, 27vw, 145px);
  letter-spacing: -6px;
}
  .lock-spacer { min-height: 12px; }
  .music-widget { height: 60px; padding: 6px 8px; gap: 6px; }
  .album-hit { width: 42px; height: 42px; flex-basis: 42px; }
  .round-shortcut { width: 42px; height: 42px; }
  .lock-bottom-row {
    left: 15px;
    right: 15px;
    bottom: 57px;
    grid-template-columns: 44px minmax(0, 1fr) 44px;
    column-gap: 6px;
  }
  .unlock-area { margin-top: 8px; }
  .key { width: min(100%, 55px); }
  .keypad { gap: 6px; }
  .pin-title { margin-top: 7px; }
  .pin-dots { margin-top: 16px; }
  .player-cover { width: min(58%, 220px); margin-bottom: 18px; }
  .player-controls { margin-top: 14px; }
}
@media (max-height: 560px) {
  .lock-heading { transform: translateY(15px); }
  .lock-clock {
  font-size: clamp(90px, 27vw, 145px);
  letter-spacing: -6px;
}
  .lock-bottom-row { bottom: 43px; }
  .music-widget { height: 54px; }
  .album-hit { width: 38px; height: 38px; flex-basis: 38px; }
  .round-shortcut { width: 40px; height: 40px; }
  .pin-title { margin-top: 8px; }
  .pin-dots { margin-top: 12px; }
  .keypad { gap: 4px 8px; }
  .key { width: min(100%, 48px); }
  .player-cover { width: min(48%, 180px); margin-bottom: 12px; }
}

.camera-hole {
  position: absolute;
  top: 9px;
  left: 50%;
  transform: translateX(-50%);
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: #000;
  border: 1px solid #252525;
  box-shadow: 0 0 0 1px rgba(255,255,255,.08);
  z-index: 30;
}


/* FIX: KEEP THE BOTTOM ROW AT THE BOTTOM OF THE LOCK SCREEN */
.screen#lockScreen {
  position: absolute !important;
  inset: 0 !important;
  height: 100% !important;
  min-height: 0 !important;
}
.screen#lockScreen > .lock-bottom-row {
  position: absolute !important;
  top: auto !important;
  bottom: 42px !important;
  left: 15px !important;
  right: 15px !important;
  width: auto !important;
  margin: 0 !important;
  transform: none !important;
  z-index: 25 !important;
}
@media (max-height: 740px) {
  .screen#lockScreen > .lock-bottom-row {
    bottom: 38px !important;
  }
}

/* Lock icon: fixed in place, without moving other elements */

#lockScreen > .lock-status-icon {
  position: absolute;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 24px;
  z-index: 30;
  display: grid;
  place-items: center;
  pointer-events: none;
}

#lockScreen > .lock-status-icon svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 2px rgba(255,255,255,.35));
}

#lockScreen > .lock-status-icon svg rect,
#lockScreen > .lock-status-icon svg path {
  stroke: #000;
}

#lockScreen > .lock-status-icon svg circle {
  fill: #000;
}
/* FIX: จัดปุ่มเลข 0 ให้อยู่กึ่งกลาง */
#pinScreen .keypad > button[data-digit="0"] {
  grid-column: 2;
  justify-self: center;
  align-self: center;
  margin: 0;
}
</style>
</head>

<div class="stage">
<main class="phone" id="phone">

  <div class="status-bar">
    <span id="statusTime">12:00</span>
    <div class="status-right">
      <span class="fiveg">5G</span>
      <span class="signal" aria-label="สัญญาณมือถือ"><i></i><i></i><i></i><i></i></span>
      <span class="battery" aria-label="แบตเตอรี่ 82%"><span class="battery-level"></span></span>
    </div>

  <!-- LOCK SCREEN -->
  <section class="screen" id="lockScreen">

<div class="lock-status-icon" aria-label="หน้าจอยังไม่ได้ปลดล็อก">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <!-- ตัวกุญแจสีดำทึบ -->
    <path
      d="M7 10V7a5 5 0 0 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1zm2 0h6V7a3 3 0 0 0-6 0v3z"

</div>



    <div class="lock-heading">

    <div class="lock-bottom-row">

      </button>

      <div class="music-widget">
        <button class="album-hit" id="openPlayerCover" aria-label="เปิดหน้าจอเล่นเพลง">

      <button class="app-button" data-app="ปฏิทิน"><span class="app-icon" style="background:#f5f0e8">📅</span><span class="app-label">ปฏิทิน</span></button>
      <button class="app-button" data-app="การตั้งค่า"><span class="app-icon" style="background:#c5c9d5">⚙️</span><span class="app-label">การตั้งค่า</span></button>
      <button class="app-button" data-app="โน้ต"><span class="app-icon" style="background:#f0dc87">📝</span><span class="app-label">โน้ต</span></button>
    </div>
    <div class="dock">
      <button class="app-button" data-app="โทรศัพท์"><span class="app-icon" style="background:#4dbb83">☎️</span></button>
      <button class="app-button" data-app="ข้อความ"><span class="app-icon" style="background:#72c7a0">💬</span></button>
      <button class="app-button" data-app="อินเทอร์เน็ต"><span class="app-icon" style="background:#8ab7e8">🌐</span></button>
      <button class="app-button" data-app="กล้อง"><span class="app-icon" style="background:#d7d7df">📷</span></button>
    </div>
    <div class="home-gesture" id="homeGesture"></div>
  </section>

  <!-- LARGE MUSIC PLAYER -->
  <section class="screen hidden" id="playerScreen">
    <button class="player-back" id="playerBack">‹</button>
    <div class="player-label">NOW PLAYING</div>
    <div class="player-cover"><img src="https://img.youtube.com/vi/HKBifVrELZI/hqdefault.jpg" alt="ปกเพลง ไม่คิดนอกใจ"></div>
    <div class="player-details">
      <div class="player-title">ไม่คิดนอกใจ</div>
      <div class="player-artist">LOSO</div>
      <div class="player-progress">
        <div class="progress-track"><div class="progress-fill"></div></div>
        <div class="progress-times"><span>1:24</span><span>4:12</span></div>
      </div>
      <div class="player-controls">
        <button class="player-control" id="previousButton">|◀</button>
        <button class="player-control main" id="playerPlay">▶</button>
        <button class="player-control" id="nextButton">▶|</button>
      </div>
    </div>
    <div class="player-note">เครื่องเล่นจำลอง · ไม่มีเสียงจริง</div>
    <div class="player-gesture" id="playerGesture"></div>
  </section>

  <!-- MOCK APPS -->
  <section class="screen hidden" id="appScreen">
    <div class="app-window-header">
      <button class="app-back" id="appBack">‹</button>
      <div class="app-window-title" id="appWindowTitle">แอป</div>
    </div>
    <div class="app-content" id="appContent"></div>
    <div class="app-home-gesture" id="appHomeGesture"></div>
  </section>
  <div class="toast" id="toast"></div>
</main>
</div>

<script>
(() => {
  const CORRECT_PIN = "121269";
  const $ = id => document.getElementById(id);
  const screens = {
    lock: $("lockScreen"), pin: $("pinScreen"), home: $("homeScreen"),
    player: $("playerScreen"), app: $("appScreen")
  };
  let currentScreen = "lock";
  let pin = "";
  let isPlaying = false;
  let flashlightOn = false;
  let toastTimer;

  function showScreen(name) {
    Object.entries(screens).forEach(([key, screen]) => screen.classList.toggle("hidden", key !== name));
    currentScreen = name;
  }
  function showToast(message) {
    const toast = $("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1700);
  }
  window.phoneDemoToast = showToast;

  function updateClock() {
    const now = new Date();
    const time = now.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", hour12: false });
    const date = now.toLocaleDateString("th-TH", { weekday: "long", day: "numeric", month: "long" });
    $("statusTime").textContent = time;
    $("lockClock").textContent = time;
    $("homeClock").textContent = time;
    $("lockDate").textContent = date;
    $("homeDate").textContent = date;
  }
  function updatePinDots() {
    document.querySelectorAll(".pin-dot").forEach((dot, index) => dot.classList.toggle("filled", index < pin.length));
  }
  function openPin() {
    pin = "";
    updatePinDots();
    $("pinError").textContent = "";
    showScreen("pin");
  }
  function enterDigit(digit) {
    if (pin.length >= 6) return;
    pin += digit;
    updatePinDots();
    $("pinError").textContent = "";
    if (pin.length === 6) {
      if (pin === CORRECT_PIN) {
        setTimeout(() => { pin = ""; updatePinDots(); showScreen("home"); }, 150);
      } else {
        $("pinError").textContent = "PIN ไม่ถูกต้อง ลองอีกครั้ง";
        setTimeout(() => { pin = ""; updatePinDots(); }, 650);
      }
    }
  }
  function setPlaying(value) {
    isPlaying = value;
    $("widgetPlay").textContent = isPlaying ? "Ⅱ" : "▶";
    $("playerPlay").textContent = isPlaying ? "Ⅱ" : "▶";
    $("widgetPlay").setAttribute("aria-label", isPlaying ? "หยุดเพลงจำลอง" : "เล่นเพลงจำลอง");
  }
  function openPlayer() { showScreen("player"); }

  $("unlockGesture").addEventListener("click", openPin);
  $("pinBack").addEventListener("click", () => showScreen("lock"));
  $("pinGestureBack").addEventListener("click", () => showScreen("lock"));
  $("openPlayerCover").addEventListener("click", openPlayer);
  $("openPlayerInfo").addEventListener("click", openPlayer);
  $("openPlayerInfo").addEventListener("keydown", event => {
    if (event.target.id === "widgetPlay") return;
    if (event.key === "Enter" || event.key === " ") { event.preventDefault(); openPlayer(); }
  });
  $("widgetPlay").addEventListener("click", event => {
    event.stopPropagation(); event.preventDefault(); setPlaying(!isPlaying);
  });
  $("playerPlay").addEventListener("click", () => setPlaying(!isPlaying));
  $("playerBack").addEventListener("click", () => showScreen("lock"));
  $("playerGesture").addEventListener("click", () => showScreen("lock"));
  $("previousButton").addEventListener("click", () => showToast("ไม่มีเพลงก่อนหน้า"));
  $("nextButton").addEventListener("click", () => showToast("ไม่มีเพลงถัดไป"));
  $("flashlightButton").addEventListener("click", () => {
    flashlightOn = !flashlightOn;
    $("flashlightButton").style.background = flashlightOn ? "rgba(255,255,255,.38)" : "rgba(27,26,40,.57)";
    showToast(flashlightOn ? "เปิดไฟฉายจำลองแล้ว" : "ปิดไฟฉายแล้ว");
  });
  $("cameraButton").addEventListener("click", () => openApp("กล้อง"));
  document.querySelectorAll("[data-digit]").forEach(button => button.addEventListener("click", () => enterDigit(button.dataset.digit)));
  $("deleteDigit").addEventListener("click", () => { pin = pin.slice(0, -1); updatePinDots(); $("pinError").textContent = ""; });
  $("emergencyButton").addEventListener("click", () => showToast("หน้าจอฉุกเฉินจำลอง"));

  function openApp(name) {
    if (name === "เพลง") { openPlayer(); return; }
    $("appWindowTitle").textContent = name;
    const content = {
      "โทรศัพท์": `<div class="mock-card"><div style="font-size:12px;color:#777">แป้นกด</div><div style="font-size:28px;text-align:center;margin:24px 0">＋</div><button class="mock-primary" onclick="phoneDemoToast('โทรศัพท์จำลอง')">โทร</button></div>`,
      "ข้อความ": `<div class="mock-card"><strong>ข้อความ</strong><p>ยังไม่มีข้อความใหม่</p></div><div class="mock-card">เริ่มการสนทนาใหม่</div>`,
      "แกลเลอรี": `<div class="mock-card" style="text-align:center"><div style="font-size:55px">🌄</div><strong>รูปภาพของคุณ</strong><p>แกลเลอรีจำลอง</p></div>`,
      "กล้อง": `<div class="mock-card" style="text-align:center;background:#292732;color:white;padding:45px 12px"><div style="font-size:48px">📷</div><p>หน้าจอกล้องจำลอง</p><button class="mock-primary" onclick="phoneDemoToast('ถ่ายภาพจำลองแล้ว')">● ถ่ายภาพ</button></div>`,
      "ปฏิทิน": `<div class="mock-card"><strong>ปฏิทิน</strong><p>วันนี้</p><p>ไม่มีนัดหมาย</p></div>`,
      "การตั้งค่า": `<div class="mock-card">การเชื่อมต่อ</div><div class="mock-card">หน้าจอและความสว่าง</div><div class="mock-card">วอลเปเปอร์และสไตล์</div><div class="mock-card">ความปลอดภัยและความเป็นส่วนตัว</div>`,
      "โน้ต": `<div class="mock-card"><strong>โน้ตใหม่</strong><p contenteditable="true">แตะตรงนี้เพื่อพิมพ์โน้ต...</p></div>`,
      "อินเทอร์เน็ต": `<div class="mock-card"><strong>เบราว์เซอร์จำลอง</strong><p>ไม่มีการเปิดเว็บไซต์จริง</p><input placeholder="พิมพ์เพื่อค้นหา" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px"></div>`
    };
    $("appContent").innerHTML = content[name] || `<div class="mock-card">${name}</div>`;
    showScreen("app");
  }
  document.querySelectorAll("[data-app]").forEach(button => button.addEventListener("click", () => openApp(button.dataset.app)));
  $("appBack").addEventListener("click", () => showScreen("home"));
  $("appHomeGesture").addEventListener("click", () => showScreen("home"));
  $("homeGesture").addEventListener("click", () => showScreen("lock"));

  let touchStartY = null;
  $("phone").addEventListener("touchstart", event => {
    if (event.touches.length === 1) touchStartY = event.touches[0].clientY;
  }, { passive: true });
  $("phone").addEventListener("touchend", event => {
    if (touchStartY === null || !event.changedTouches.length) return;
    const endY = event.changedTouches[0].clientY;
    const delta = touchStartY - endY;
    touchStartY = null;
    if (delta > 65) {
      if (currentScreen === "lock") openPin();
      else if (currentScreen === "player") showScreen("lock");
      else if (currentScreen === "app") showScreen("home");
    } else if (delta < -65) {
      if (currentScreen === "pin") showScreen("lock");
      else if (currentScreen === "home") showScreen("lock");
    }
  }, { passive: true });

  updateClock();
  setInterval(updateClock, 1000);
  setPlaying(false);
})();
</script>
</body>
</html>
